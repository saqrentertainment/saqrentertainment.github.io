<!DOCTYPE html>
<html lang="en">
<head>
    <title>Saqr Entertainment</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="src/bootstrap.css" rel="stylesheet">
    <link href="src/style.css" rel="stylesheet">

    <script src="src/jquery.js"></script>
    <script src="src/bootstrap5.js"></script>
</head>

<body class="bg-secondary-subtle">

    <!-- Header -->
    <div id="header"></div>

    <!-- Main Content -->
    <div id="content" style="display:none;">

        <main>

            <section class="container bg-white py-5">

                <h2 class="fw-bold mb-4">
                    Contact Us
                </h2>

                <section class="container bg-white py-5">

                    <h2 class="fw-bold mb-4 text-center">
                        Let's Connect!
                    </h2>

                    <p class="lead">
                        We always look forward to hearing from you.
                        Got a question about sizing, your order, our return process or anything else?

                        Just reach out using the contact form below and send us your inquiry.

                        We'll respond to your message as soon as possible.
                    </p>

                </section>

                <section class="container py-5">

                    <form action="https://formsubmit.co/SaqrEntertainment@outlook.com"
                          method="POST"
                          class="mt-4"
                          style="max-width:600px; margin:0 auto;">

                        <div class="mb-3">
                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   placeholder="Your Name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Your Email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <textarea name="message"
                                      rows="5"
                                      class="form-control"
                                      placeholder="Your Message"
                                      required></textarea>
                        </div>

                        <input type="hidden"
                               name="_next"
                               value="https://nawafalsufiani.github.io/SaqrEntertainment/thank-you.html">

                        <input type="hidden"
                               name="_captcha"
                               value="false">

                        <button type="submit" class="btn btn-primary">
                            Send Message
                        </button>

                    </form>

                </section>

            </section>

        </main>

    </div>

    <!-- Footer -->
    <div id="footer"></div>

 <script>
$(function () {

    $("#header").load("header.html", function () {

        $("#content").show();

    });

    $("#footer").load("footer.html");

});
</script>

</body>
</html>
